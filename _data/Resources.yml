- title: HSPC Classifier
  image: /img/resources/classifier.jpg
  imageLink: https://github.com/systemsheme/hspc
  description: "We developed a <a href='https://github.com/systemsheme/hspc' target='_blank'><strong style='color:#404040ff'>machine learning classifier</strong></a> to annotate human hematopoietic stem and progenitor cell (HSPC) populations from bone marrow single-cell RNA-seq data. This tool can be used to annotate your scRNA-seq data based on cell types identified in our <a href='/pdfs/2025_MPP.pdf' target='_blank'><strong style='color:#404040ff'>prior work</strong></a>."

- title: LSC Reference
  image: /img/resources/lsc-ref.jpg
  imageLink: https://github.com/systemsheme/precog-aml
  description: "Using single-cell multi-omics, were able to identify AML LSCs at high resolution and purity. We developed an integrated single cell data set and reference signature matrix for bulk gene expression deconvolution as part of this study. The methods used to generate these tools are provided <a href='https://github.com/systemsheme/precog-aml' target='_blank'><strong style='color:#404040ff'>here</strong></a>."

- title: Xenotransplantation Protocol
  image: /img/resources/xeno.png
  imageLink: https://www.jove.com/v/65874/simplified-intrafemoral-injections-using-live-mice-allow-for
  description: "Protocol describing intrafemoral injection of hematopoietic or leukemic stem cells, including gene-edited cells, in murine xenograft models, which will not only enable the quick and safe transplantation of cells but also serial analyses of the bone marrow. The protocol is published <a href='https://www.jove.com/v/65874/simplified-intrafemoral-injections-using-live-mice-allow-forv' target='_blank'><strong style='color:#404040ff'>here</strong></a>."

- title: PowerR
  image: /img/resources/powerr-logo.png
  imageLink: https://www.systemshematology.org/PowerR/
  description: "<a href='https://www.systemshematology.org/PowerR/' target='_blank'><strong style='color:#404040ff'>PowerR</strong></a> is a Shiny application for simulation-based power analysis to support experiment planning. The app runs entirely in your browser via <a href='https://posit-dev.github.io/r-shinylive/' target='_blank'><strong style='color:#404040ff'>shinylive</strong></a> (WebAssembly), and the source is available on <a href='https://github.com/systemsheme/PowerR' target='_blank'><strong style='color:#404040ff'>GitHub</strong></a>."

- title: PrismR
  image: /img/resources/prismr-logo.png
  imageLink:  https://www.systemshematology.org/PrismR
  description: "<a href='https://www.systemshematology.org/PrismR' target='_blank'><strong style='color:#404040ff'>PrismR</strong></a> is a R Shiny app for plotting and statistics. It uses the <a href='https://csdaw.github.io/ggprism/' target='_blank'><strong style='color:#404040ff'>ggprism</strong></a> theme and palettes for visual parity with Prism, and exposes R's statistical framework through <a href='https://rpkgs.datanovia.com/rstatix/' target='_blank'><strong style='color:#404040ff'>rstatix</strong></a>. The interface is highly customizable with plotting and statistics options similar to GraphPad Prism with added 3D plotting capabilities."
