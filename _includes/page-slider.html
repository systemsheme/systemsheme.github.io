<style>
.ps-slider-outer { margin-bottom: 40px; }
.ps-slider-row {
  display: flex;
  align-items: center;
}
.ps-arrow {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid #bbb;
  background: #fff;
  color: #555;
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, color 0.2s;
  padding: 0 0 2px 0;
}
.ps-arrow:hover { border-color: #9d4844; color: #9d4844; }
.ps-viewport {
  flex: 1;
  overflow: hidden;
}
.ps-track {
  display: block;
  white-space: nowrap;
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
  font-size: 0;
}
.ps-slide {
  display: inline-block;
  vertical-align: top;
  min-width: 100%;
  width: 100%;
  box-sizing: border-box;
  padding: 0 16px;
  white-space: normal;
  font-size: 17px;
  overflow: hidden;
}
.ps-dots-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 18px 0 10px;
}
.ps-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: none;
  background: #c8c8c8;
  cursor: pointer;
  padding: 0;
  transition: background 0.2s;
}
.ps-dot-active { background: #555; }
@media (max-width: 576px) {
  .ps-arrow { width: 28px; height: 28px; font-size: 18px; border-width: 1px; }
  .ps-slide { padding: 0 6px; }
}
</style>

<script>
(function () {
  var sliderId = '{{ include.slider_id }}';
  var slider   = document.getElementById(sliderId);
  if (!slider) return;
  var track   = slider.querySelector('.ps-track');
  var dots    = slider.parentElement.querySelectorAll('.ps-dot');
  var prev    = slider.querySelector('.ps-prev');
  var next    = slider.querySelector('.ps-next');
  var total   = dots.length;
  var current = 0;

  function goTo(idx) {
    current = (idx + total) % total;
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    dots.forEach(function (d, i) {
      d.classList.toggle('ps-dot-active', i === current);
    });
  }

  prev.addEventListener('click', function () { goTo(current - 1); });
  next.addEventListener('click', function () { goTo(current + 1); });
  dots.forEach(function (d, i) {
    d.addEventListener('click', function () { goTo(i); });
  });

  var vp = slider.querySelector('.ps-viewport');
  var touchStartX = 0;
  vp.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, {passive: true});
  vp.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) goTo(current + (dx < 0 ? 1 : -1));
  }, {passive: true});
})();
</script>
